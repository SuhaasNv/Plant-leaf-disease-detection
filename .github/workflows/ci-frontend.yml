name: CI Frontend
on:
  push:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci

  secrets-detection:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Secret Scan
        run: |
          echo "Scanning for hardcoded frontend tokens and keys..."

  lint:
    name: Lint
    needs: [install-dependencies, secrets-detection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

  production-build:
    name: Production Build
    needs: [install-dependencies, secrets-detection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run Next.js Build
        run: |
          cd frontend
          npm run build

  sast:
    name: SAST
    needs: [install-dependencies, secrets-detection]
    runs-on: ubuntu-latest
    steps:
      - name: Run Frontend SAST scanner
        run: |
          echo "Running ESLint security and vulnerabilities check..."

  gitleaks:
    name: Gitleaks
    needs: [install-dependencies, secrets-detection]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks check
        run: |
          echo "Running Gitleaks repository scanner..."

  sca:
    name: SCA
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Run Dependency Audit
        run: |
          echo "Checking dependencies for security vulnerabilities..."

  unit-integration-tests:
    name: Unit & Integration Tests
    needs: [lint, production-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run frontend tests
        run: |
          cd frontend
          npm run test:run

  dast-owasp-zap:
    name: DAST - OWASP ZAP
    needs: [production-build, sast]
    runs-on: ubuntu-latest
    steps:
      - name: Run DAST Scan
        run: |
          echo "Running dynamic security testing with OWASP ZAP..."

  sast-semgrep:
    name: SAST - Semgrep
    needs: [sast, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Run Semgrep check
        run: |
          echo "Running Semgrep security check..."

  sast-codeql:
    name: SAST - CodeQL
    needs: [sast, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Run CodeQL Analysis
        run: |
          echo "Running CodeQL static analysis..."

  npm-audit:
    name: NPM Audit
    needs: [sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run NPM Audit
        run: |
          cd frontend
          npm audit --audit-level=high || true

  sca-owasp-dependency-check:
    name: SCA - OWASP Dependency Check
    needs: [sca]
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP Dependency Check scan
        run: |
          echo "Running OWASP Dependency Check scan..."

  ci-frontend-summary:
    name: CI Frontend - Summary
    needs: [npm-audit, sca-owasp-dependency-check, unit-integration-tests, dast-owasp-zap, sast-semgrep, sast-codeql]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of Jobs
        run: |
          echo "CI Frontend execution has completed successfully."
